<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>已收到申请 · Request received</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@900&display=swap" rel="stylesheet" />
<style>
  body{
    margin:0;min-height:100dvh;display:grid;place-items:center;
    background:#0a443a;color:#f7f3e8;
    font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  .box{max-width:440px;text-align:center}
  h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(28px,8vw,40px);margin:0 0 8px}
  .en{margin:0 0 18px;opacity:.85;letter-spacing:.04em}
  p{margin:0 0 14px;line-height:1.7;font-size:16px}
  a{color:#f2c230;text-underline-offset:3px}
  .muted{opacity:.8;font-size:14px}
</style>
</head>
<body>
  <div class="box">
    <h1>已收到申请</h1>
    <p class="en">Request received</p>
    <p>谢谢。我们已收到你的资料，Amy 会尽快与你联系，确认名片内容和展示方式。</p>
    <p class="muted">Thank you. We have received your details and will contact you shortly.</p>
    <p><a href="https://liuhushan888-cloud.github.io/card-apply/">返回申请页 · Back</a>
      · <a href="https://liuhushan888-cloud.github.io/">查看样例 · Sample</a></p>
  </div>
</body>
</html>
